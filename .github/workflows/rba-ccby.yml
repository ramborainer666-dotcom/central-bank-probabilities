name: Check licensed RBA probability dataset

on:
  workflow_dispatch:
  schedule:
    # Once per business day, after Australian market closes.
    - cron: '45 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: rba-ccby-model
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Fetch and validate licensed estimates
        run: python -m models.rba_open_model
      - name: Commit valid changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rba_external_model_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: RBA Rate Watch CC-BY model snapshot"
            git push
          fi
