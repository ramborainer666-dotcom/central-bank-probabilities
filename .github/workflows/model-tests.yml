name: Validate probability models

on:
  push:
    paths:
      - 'models/**'
      - 'tests/**'
      - '.github/workflows/model-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate no placeholder futures quote becomes a probability
        run: |
          python -m models.calculate --input data/futures_quotes.template.json --output /tmp/model_template_check.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/model_template_check.json'))
          assert d['records']==[]
          assert d['status']=='no_valid_quotes'
          print("No fabricated probabilities from placeholder quotes")
          PY
