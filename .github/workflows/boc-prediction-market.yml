name: Check BoC public prediction-market API

on:
  workflow_dispatch:
  schedule:
    # Three market checks on weekdays, UTC.
    - cron: '27 6,12,19 * * 1-5'

permissions:
  contents: write

concurrency:
  group: boc-prediction-markets
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m models.boc_prediction_markets
      - name: Commit validated odds only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boc_prediction_market_latest.json data/boc_prediction_market_history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update BoC prediction-market odds"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep "$((attempt * 5))"
              fi
            done
            exit 1
          fi
