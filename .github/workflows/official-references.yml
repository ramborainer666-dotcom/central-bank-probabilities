name: Update official BoC CORRA and RBA cash rate

on:
  workflow_dispatch:
  schedule:
    # Benchmark rates are published daily, not intraday; one weekday poll.
    - cron: '43 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: official-reference-data
  cancel-in-progress: false

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m models.official_reference
      - name: Commit only changed official observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official_reference_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: official BoC CORRA and RBA rates"
            git push
          fi
